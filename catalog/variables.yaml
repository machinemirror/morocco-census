# Catalogue of every published column.
#
# indicators: concepts that can be mapped. A concept observed in several censuses has one
#   entry; the columns that measure it point here with `indicator:` and carry the vintage.
# datasets: one entry per published table. Every column is listed. A column either points to
#   an indicator (and gives its vintage and exact source), or describes itself (identifiers).
# `comparable: false` or a `note` flags a definitional break between vintages.
# `agg: sum` marks counts, summed when communes are merged into a map unit; everything else is a
#   population-weighted mean (flags: max), or household-weighted with `weight: households`.

themes:
  population: {en: Population}
  age: {en: Age structure}
  fertility: {en: Fertility and mortality}
  education: {en: Education and literacy}
  languages: {en: Languages}
  employment: {en: Employment}
  occupation: {en: Occupations and sectors}
  commuting: {en: "Commuting"}
  establishments: {en: "Economic establishments"}
  family: {en: Marital status}
  migration: {en: "Migration"}
  housing: {en: Housing}
  urban_housing: {en: "Urban housing stock"}
  sanitation: {en: "Sanitation, energy and access"}
  equipment: {en: Household equipment}
  rural_settlement: {en: "Rural douars"}
  poverty: {en: Poverty and human development}

# map_groups: the map's indicator headings, HCP's own (RGPH 2024 results platform), each gathering catalogue themes.
map_groups:
  demography: {en: Demography, fr: Démographie, ar: الديموغرافيا, themes: [population, age, fertility, family]}
  education: {en: Education and literacy, fr: Education et analphabétisme, ar: التعليم والأمية, themes: [education]}
  languages: {en: Local languages used, fr: Langues locales utilisées, ar: اللغات المحلية المستعملة, themes: [languages]}
  activity: {en: Economic activity, fr: Activité économique, ar: النشاط الاقتصادي, themes: [employment]}
  housing: {en: Housing conditions, fr: Conditions d'habitat, ar: ظروف السكن, themes: [housing, sanitation, equipment]}

indicators:
  population:
    agg: sum
    theme: population
    en: Population
    fr: Population municipale
    ar: السكان البلديون
    label_source: RGPH 2024 results platform, indicator menu (resultats2024.rgphapps.ma, chart 667)
    unit: persons
    definition: Resident population of the commune.
    note: 2004 is the app's 'Population totale'; 2014 and 2024 are 'population municipale' (excludes the population comptée à part, e.g. barracks and boarding schools).
  population_legal:
    agg: sum
    theme: population
    en: Legal population
    unit: persons
    definition: HCP's legal population of the commune, the municipal population plus the population comptée à part (people living collectively, e.g. in barracks, prisons and boarding schools).
    note: The indicator tables' rates are on the municipal population ('population'); use the legal population as a denominator where institutional residents matter (garrison and Saharan communes, large cities). HCP gives no 2014 figure ('pm') for Lagouira, Aghouinite, Zoug (Aousserd) and Mijik (Oued Ed-Dahab).
  pop_share:
    agg: sum
    theme: population
    en: Share of national population
    unit: "%"
    definition: Commune population divided by the sum over all commune rows, times 100.
  is_urban:
    theme: population
    en: Urban commune
    unit: flag
    definition: 1 for municipalities and arrondissements, 0 for rural communes.
    note: 2014 uses the '(Mun.)'/'(Arrond.)' suffix of HCP's commune name; 2024 flags communes with no rural population. The two agree for every commune matched across both censuses; 2024 has fewer urban units because the six arrondissement cities are single communes there.
  n_households:
    agg: sum
    theme: population
    en: Households
    fr: Nombre de ménages
    ar: عدد الأسر
    label_source: RGPH 2024 results platform, indicator menu (resultats2024.rgphapps.ma, chart 667)
    unit: households
    definition: Number of ordinary households.
  hh_size_avg:
    weight: households
    theme: population
    en: Average household size
    fr: Taille moyenne des ménages
    ar: متوسط حجم الأسرة
    label_source: RGPH 2024 results platform, indicator menu (resultats2024.rgphapps.ma, chart 667)
    unit: persons
    definition: Persons per ordinary household.
  pct_female:
    theme: population
    en: Female share
    fr: 'Sexe : Féminin'
    ar: 'الجنس: إناث'
    label_source: RGPH 2024 Population et ménages par douar, bilingual headers
    unit: "%"
    definition: Women as a share of the population.
    note: "2014 is computed from HCP's female and total population municipale."
  age_0_4:
    theme: age
    en: Aged 0-4
    fr: "Groupes d'âge : 0-4 ans"
    ar: 'الفئات العمرية: 0-4 سنة'
    label_source: 'RGPH 2024 Indicateurs démographiques et socio-économiques, headers; Arabic: HCP Marrakech-Safi, note RGPH 2024 province de Chichaoua (hcp.ma/region-marrakech/attachment/2801766/), age pyramid'
    unit: "%"
    definition: Share of the population aged 0 to 4.
  age_5_9:
    theme: age
    en: Aged 5-9
    fr: "Groupes d'âge : 5-9 ans"
    ar: 'الفئات العمرية: 5-9 سنة'
    label_source: 'RGPH 2024 Indicateurs démographiques et socio-économiques, headers; Arabic: HCP Marrakech-Safi, note RGPH 2024 province de Chichaoua (hcp.ma/region-marrakech/attachment/2801766/), age pyramid'
    unit: "%"
    definition: Share of the population aged 5 to 9.
  age_10_14:
    theme: age
    en: Aged 10-14
    fr: "Groupes d'âge : 10-14 ans"
    ar: 'الفئات العمرية: 10-14 سنة'
    label_source: 'RGPH 2024 Indicateurs démographiques et socio-économiques, headers; Arabic: HCP Marrakech-Safi, note RGPH 2024 province de Chichaoua (hcp.ma/region-marrakech/attachment/2801766/), age pyramid'
    unit: "%"
    definition: Share of the population aged 10 to 14.
  isf:
    theme: fertility
    en: Total fertility rate
    fr: Indice synthétique de fécondité
    ar: المؤشر التركيبي للخصوبة
    label_source: RGPH 2024 results platform, indicator menu (resultats2024.rgphapps.ma, chart 667)
    unit: children per woman
    definition: "Mean number of live births a woman would have at the fertility rates of the 12 months before the census."
    note: "2024 is HCP's 'indicateur conjoncturel de fécondité', the same measure under another name."
  birth_rate:
    theme: fertility
    en: Crude birth rate
    unit: per 1,000
    definition: Live births per 1,000 population.
  infant_mortality:
    theme: fertility
    en: Infant mortality rate
    unit: per 1,000 births
    definition: Deaths under age one per 1,000 live births.
  pct_illiterate:
    theme: education
    en: Illiteracy rate
    fr: Taux d'analphabétisme
    ar: معدل الأمية
    label_source: RGPH 2024 results platform, Concepts et définitions (FR/AR)
    unit: "%"
    definition: Share of the population aged 10 and over who cannot read and write.
  pct_no_lang_written:
    theme: "languages"
    en: Reads and writes no language
    unit: "%"
    definition: Share answering 'Aucune' to languages read and written. This is the 'illiterate' variable of Lehnert (2021) and Lehnert & Smirnov (2024), distinct from the illiteracy rate.
  pct_no_education:
    theme: education
    en: No schooling
    fr: "Population selon le niveau d'études : Néant"
    ar: 'السكان حسب مستوى التعليم: بدون مستوى دراسي'
    label_source: RGPH 2024 results platform, indicator menu (resultats2024.rgphapps.ma, chart 667)
    unit: "%"
    definition: "Share of the population with no level of general education."
    note: "2004 is a share of the population aged 25 and over, and HCP's 2004 levels sum to about 96% (a category is not published); 2014 and 2024 are HCP's commune shares on a wider base, so 2004 levels are not comparable."
    comparable: false
  pct_no_diploma:
    theme: education
    en: No diploma
    unit: "%"
    definition: "Share of the population aged 10 and over with no general-education diploma."
  pct_higher_ed:
    theme: education
    en: Higher-education diploma
    unit: "%"
    definition: "Share of the population aged 10 and over whose highest diploma is a DEUG, licence, master, doctorate or equivalent (sum of the two diploma indicators)."
  activity_rate:
    theme: employment
    en: Activity rate
    fr: Taux d'activité
    ar: معدل النشاط
    label_source: 'RGPH 2024 Indicateurs démographiques et socio-économiques, headers; Arabic: HCP Marrakech-Safi, note RGPH 2024 province de Chichaoua (hcp.ma/region-marrakech/attachment/2801766/), p.8'
    unit: "%"
    definition: Economically active population as a share of the working-age population.
    note: 2004 is the share 'Actifs' in the app's activity table; 2014 is the 'taux net d'activité'; 2024 is the activity rate of those aged 15 and over. Bases differ, so compare levels with care.
    comparable: false
  unemployment_rate:
    theme: employment
    en: Unemployment rate
    unit: "%"
    definition: "Unemployed persons as a share of the active population aged 15 and over."
  pop_active_occupee:
    agg: sum
    theme: employment
    en: Employed population (15+)
    unit: persons
    definition: Employed persons aged 15 and over.
  pct_agriculture:
    theme: "occupation"
    en: "Agriculture, forestry and fishing"
    unit: "%"
    definition: "Share of employed persons working in agriculture, forestry and fishing."
    note: "2004 is a share of employed persons plus unemployed persons who have worked before; 2014 is a share of employed persons aged 15 and over."
    comparable: false
  pct_women_divorced:
    theme: family
    en: "Divorced women"
    unit: "%"
    definition: "Share of women aged 15 and over who are divorced."
    note: "2004 is computed from the female counts of the marital-status table; 2014 and 2024 are HCP's female 'Divorcé' shares. The 2014 base is wider than 15 and over (see Divorced)."
    comparable: false
  pct_migrant_since99:
    theme: migration
    en: Moved in since 1999
    unit: "%"
    definition: Share whose 1999 residence was a different commune.
  pct_owner:
    weight: households
    theme: housing
    en: Owner-occupied households
    fr: "Statut d'occupation : Propriétaire"
    ar: 'صفة الحيازة: مالك'
    label_source: RGPH 2024 results platform, indicator menu (resultats2024.rgphapps.ma, chart 667)
    unit: "%"
    definition: Share of households owning their dwelling.
  pct_renter:
    weight: households
    theme: housing
    en: Renting households
    fr: "Statut d'occupation : Locataire"
    ar: 'صفة الحيازة: مكتري'
    label_source: RGPH 2024 results platform, indicator menu (resultats2024.rgphapps.ma, chart 667)
    unit: "%"
    definition: Share of households renting their dwelling.
  pct_electricity:
    weight: households
    theme: housing
    en: Electricity
    fr: Électricité
    ar: الكهرباء
    label_source: RGPH 2024 results platform, indicator menu (resultats2024.rgphapps.ma, chart 667)
    unit: "%"
    definition: Share of households with electricity.
    note: "2024 counts households connected to the public grid or lit by solar power or a generator."
  pct_water:
    weight: households
    theme: housing
    en: Piped water
    fr: Eau courante
    ar: الماء الصالح للشرب
    label_source: RGPH 2024 results platform, indicator menu (resultats2024.rgphapps.ma, chart 667)
    unit: "%"
    definition: "Share of households whose dwelling is connected to a piped water network."
  pct_cellphone:
    weight: households
    theme: "equipment"
    en: Mobile phone
    unit: "%"
    definition: "Share of households with a mobile phone."
    note: "Household equipment is not published at commune level for 2024."
  pct_internet:
    weight: households
    theme: "equipment"
    en: Internet
    unit: "%"
    definition: "Share of households with internet access."
    note: "Household equipment is not published at commune level for 2024."
  pct_tv:
    weight: households
    theme: "equipment"
    en: Television
    unit: "%"
    definition: "Share of households with a television."
    note: "Household equipment is not published at commune level for 2024."
  pct_slum:
    theme: housing
    en: Makeshift housing or slum
    fr: 'Type de logement : Maison sommaire ou bidonville'
    ar: 'نوع المسكن: دار بدائية أو صفيحية'
    label_source: RGPH 2024 Population et ménages par douar, bilingual headers
    unit: "%"
    definition: "Share of households living in a makeshift dwelling or a slum (maison sommaire, bidonville)."
    note: "2014 category is 'Habitat sommaire'. In 89 communes HCP's 2004 dwelling-type shares sum to less than 100% as published."
  idh:
    theme: poverty
    en: Human development index (IDH)
    unit: index 0-1
    definition: HCP's commune human development index (education, health, standard of living).
  ids:
    theme: poverty
    en: Social development index (IDS)
    unit: index 0-1
    definition: HCP's commune social development index. Not computed for urban municipalities (390 missing).
  poverty_rate:
    theme: poverty
    en: Monetary poverty rate
    unit: "%"
    definition: Share of the population below the monetary poverty line (small-area estimate).
  vulnerability_monetary:
    theme: poverty
    en: Monetary vulnerability
    unit: "%"
    definition: Share of the population between the poverty line and 1.5 times it.
  poverty_severity:
    theme: poverty
    en: Poverty severity
    unit: index
    definition: Squared poverty gap (FGT2).
  inequality:
    theme: poverty
    en: Inequality
    unit: index
    definition: Inequality index as printed in HCP's 2004 annex.
  mpi_carto:
    theme: poverty
    en: Multidimensional poverty index (poverty map)
    unit: "%"
    definition: MPI (H x A) from HCP's 2004-2014 commune poverty map, expressed in percent.
    note: Not the same methodology or scale as the 2014/2024 MPI database; do not mix the two series.
  mpi_rate_carto:
    theme: poverty
    en: Multidimensional poverty rate (poverty map)
    unit: "%"
    definition: Headcount H from HCP's 2004-2014 poverty map.
  mpi_intensity_carto:
    theme: poverty
    en: Intensity of deprivation (poverty map)
    unit: "%"
    definition: Average deprivation share A among the poor, 2004-2014 poverty map.
  poverty_global_carto:
    theme: poverty
    en: Overall poverty rate (poverty map)
    unit: "%"
    definition: Share poor in monetary or multidimensional terms, 2014 poverty map.
  mpi:
    theme: poverty
    en: Multidimensional poverty index
    unit: index 0-1
    definition: MPI = H x A from HCP's May-2025 database, computed on the same basis for 2014 and 2024.
  mpi_rate:
    theme: poverty
    en: Multidimensional poverty rate
    unit: "%"
    definition: Headcount H, share of the population in multidimensional poverty.
  mpi_intensity:
    theme: poverty
    en: Intensity of multidimensional poverty
    unit: "%"
    definition: Average deprivation share A among the multidimensionally poor.
  vulnerability:
    theme: poverty
    en: Vulnerability to multidimensional poverty
    unit: "%"
    definition: Share of the population vulnerable to multidimensional poverty.

  age_15_19:
    theme: "age"
    en: "Aged 15-19"
    fr: "Groupes d'âge : 15-19 ans"
    ar: 'الفئات العمرية: 15-19 سنة'
    label_source: 'RGPH 2024 Indicateurs démographiques et socio-économiques, headers; Arabic: HCP Marrakech-Safi, note RGPH 2024 province de Chichaoua (hcp.ma/region-marrakech/attachment/2801766/), age pyramid'
    unit: "%"
    definition: "Share of the population aged 15 to 19."
  age_20_24:
    theme: "age"
    en: "Aged 20-24"
    fr: "Groupes d'âge : 20-24 ans"
    ar: 'الفئات العمرية: 20-24 سنة'
    label_source: 'RGPH 2024 Indicateurs démographiques et socio-économiques, headers; Arabic: HCP Marrakech-Safi, note RGPH 2024 province de Chichaoua (hcp.ma/region-marrakech/attachment/2801766/), age pyramid'
    unit: "%"
    definition: "Share of the population aged 20 to 24."
  age_25_29:
    theme: "age"
    en: "Aged 25-29"
    unit: "%"
    definition: "Share of the population aged 25 to 29."
  age_30_34:
    theme: "age"
    en: "Aged 30-34"
    unit: "%"
    definition: "Share of the population aged 30 to 34."
  age_35_39:
    theme: "age"
    en: "Aged 35-39"
    unit: "%"
    definition: "Share of the population aged 35 to 39."
  age_40_44:
    theme: "age"
    en: "Aged 40-44"
    unit: "%"
    definition: "Share of the population aged 40 to 44."
  age_45_49:
    theme: "age"
    en: "Aged 45-49"
    unit: "%"
    definition: "Share of the population aged 45 to 49."
  age_50_54:
    theme: "age"
    en: "Aged 50-54"
    unit: "%"
    definition: "Share of the population aged 50 to 54."
  age_55_59:
    theme: "age"
    en: "Aged 55-59"
    unit: "%"
    definition: "Share of the population aged 55 to 59."
  age_60_64:
    theme: "age"
    en: "Aged 60-64"
    unit: "%"
    definition: "Share of the population aged 60 to 64."
  age_65_69:
    theme: "age"
    en: "Aged 65-69"
    unit: "%"
    definition: "Share of the population aged 65 to 69."
  age_70_74:
    theme: "age"
    en: "Aged 70-74"
    unit: "%"
    definition: "Share of the population aged 70 to 74."
  age_75plus:
    theme: "age"
    en: "Aged 75 and over"
    fr: "Groupes d'âge : 75 ans ou plus"
    ar: 'الفئات العمرية: 75 فأكثر'
    label_source: 'RGPH 2024 Indicateurs démographiques et socio-économiques, headers; Arabic: HCP Rabat-Salé-Kénitra, RGPH 2014 commune series (Dar Bel Amri), age table'
    unit: "%"
    definition: "Share of the population aged 75 and over."
  age_60plus:
    theme: "age"
    en: "Aged 60 and over"
    fr: Proportion de la population âgée de 60 ans et plus
    ar: نسبة السكان البالغين من العمر 60 سنة أو أكثر
    label_source: RGPH 2024 results platform, indicator menu (resultats2024.rgphapps.ma, chart 667)
    unit: "%"
    definition: "Share of the population aged 60 and over."
  age_65plus:
    theme: "age"
    en: "Aged 65 and over"
    unit: "%"
    definition: "Share of the population aged 65 and over."
  pct_disability:
    theme: "population"
    en: "Disability prevalence"
    unit: "%"
    definition: "Share of the population with a total incapacity or much difficulty in at least one of six functional domains (sight, hearing, mobility, communication, memory, self-care)."
  pct_single:
    theme: "family"
    en: "Never married"
    fr: 'État matrimonial : Célibataire'
    ar: 'الحالة الزواجية: عازب'
    label_source: RGPH 2024 Population et ménages par douar, bilingual headers
    unit: "%"
    definition: "Share never married in the marital-status distribution."
    note: "2004 and 2024 are shares of the population aged 15 and over. HCP's 2014 commune table uses a wider base (never-married is about 53% at the median commune, against 31% in 2024), so 2014 levels are not comparable."
    comparable: false
  pct_married:
    theme: "family"
    en: "Married"
    fr: 'État matrimonial : Marié'
    ar: 'الحالة الزواجية: متزوج'
    label_source: RGPH 2024 Population et ménages par douar, bilingual headers
    unit: "%"
    definition: "Share married in the marital-status distribution."
    note: "2004 and 2024 are shares of the population aged 15 and over. HCP's 2014 commune table uses a wider base (never-married is about 53% at the median commune, against 31% in 2024), so 2014 levels are not comparable."
    comparable: false
  pct_divorced:
    theme: "family"
    en: "Divorced"
    fr: 'État matrimonial : Divorcé'
    ar: 'الحالة الزواجية: مطلق'
    label_source: RGPH 2024 Population et ménages par douar, bilingual headers
    unit: "%"
    definition: "Share divorced in the marital-status distribution, both sexes."
    note: "2004 and 2024 are shares of the population aged 15 and over. HCP's 2014 commune table uses a wider base (never-married is about 53% at the median commune, against 31% in 2024), so 2014 levels are not comparable."
    comparable: false
  pct_widowed:
    theme: "family"
    en: "Widowed"
    fr: 'État matrimonial : Veuf'
    ar: 'الحالة الزواجية: أرمل'
    label_source: RGPH 2024 Population et ménages par douar, bilingual headers
    unit: "%"
    definition: "Share widowed in the marital-status distribution."
    note: "2004 and 2024 are shares of the population aged 15 and over. HCP's 2014 commune table uses a wider base (never-married is about 53% at the median commune, against 31% in 2024), so 2014 levels are not comparable."
    comparable: false
  age_first_marriage:
    theme: "family"
    en: "Mean age at first marriage"
    unit: "years"
    definition: "Mean age at first marriage, both sexes."
    note: "2024 is HCP's singulate mean age at marriage (âge moyen singulier au mariage): the mean years spent single by people who married before 55."
  completed_fertility:
    theme: "fertility"
    en: "Completed fertility"
    unit: "children per woman"
    definition: "Mean number of live births to women aged 45-49, at the end of their reproductive years."
    note: "2014 is HCP's mean parity at 45-49 (parité moyenne à 45-49 ans); 2024 is its descendance finale, computed for the same age group."
  school_enrolment:
    theme: "education"
    en: "School enrolment of young children"
    unit: "%"
    definition: "Share of children aged 7-12 at the census date who were enrolled in school."
    note: "HCP labels the 2024 group by age during the 2023/24 school year (6-11), which is the 7-12 group at the census date."
  pct_illiterate_15plus:
    theme: "education"
    en: "Illiteracy rate (15+)"
    unit: "%"
    definition: "Share of the population aged 15 and over who cannot read and write."
  edu_preschool:
    theme: "education"
    en: "Preschool level"
    unit: "%"
    definition: "Share of the population whose highest level of general education is preschool."
  edu_primary:
    theme: "education"
    en: "Primary level"
    fr: "Population selon le niveau d'études : Primaire"
    ar: 'السكان حسب مستوى التعليم: الابتدائي'
