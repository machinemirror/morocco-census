    note_ar: "قيمتا 2004 و2024 نسبتان من السكان البالغين 15 سنة فأكثر. ويعتمد جدول 2014 الجماعي للمندوبية السامية للتخطيط قاعدة أوسع (تبلغ نسبة العزاب نحو 53% في الجماعة الوسيطة، مقابل 31% سنة 2024)، لذا فمستويات 2014 غير قابلة للمقارنة."
    comparable: false
  age_first_marriage:
    theme: "family"
    en: "Mean age at first marriage"
    fr: "Âge moyen au premier mariage"
    ar: "متوسط السن عند الزواج الأول"
    unit: "years"
    definition: "Mean age at first marriage, both sexes."
    definition_fr: "Âge moyen au premier mariage, deux sexes confondus."
    definition_ar: "متوسط السن عند الزواج الأول، للجنسين معا."
    note: "2024 is HCP's singulate mean age at marriage (âge moyen singulier au mariage): the mean years spent single by people who married before 55."
    note_fr: "Pour 2024, âge moyen singulier au mariage du HCP : nombre moyen d'années passées en célibat par les personnes mariées avant 55 ans."
    note_ar: "قيمة 2024 هي متوسط السن عند الزواج الأول المحسوب بطريقة العزوبة لدى المندوبية السامية للتخطيط (âge moyen singulier au mariage): متوسط عدد السنوات التي قضاها في العزوبة الأشخاص الذين تزوجوا قبل سن 55."
  completed_fertility:
    theme: "fertility"
    en: "Completed fertility"
    fr: "Descendance finale"
    ar: "الخصوبة المكتملة"
    unit: "children per woman"
    definition: "Mean number of live births to women aged 45-49, at the end of their reproductive years."
    definition_fr: "Nombre moyen de naissances vivantes des femmes âgées de 45-49 ans, en fin de vie féconde."
    definition_ar: "متوسط عدد المواليد الأحياء لدى النساء البالغات 45-49 سنة، في نهاية فترة الإنجاب."
    note: "2014 is HCP's mean parity at 45-49 (parité moyenne à 45-49 ans); 2024 is its descendance finale, computed for the same age group."
    note_fr: "Pour 2014, parité moyenne à 45-49 ans du HCP ; pour 2024, sa descendance finale, calculée pour le même groupe d'âge."
    note_ar: "قيمة 2014 هي متوسط عدد الولادات عند 45-49 سنة لدى المندوبية السامية للتخطيط (parité moyenne à 45-49 ans)؛ وقيمة 2024 هي الخصوبة المكتملة (descendance finale)، محسوبا للفئة العمرية نفسها."
  school_enrolment:
    theme: "education"
    en: "School enrolment of young children"
    fr: "Taux de scolarisation des jeunes enfants"
    ar: "معدل تمدرس الأطفال الصغار"
    unit: "%"
    definition: "Share of children aged 7-12 at the census date who were enrolled in school."
    definition_fr: "Part des enfants âgés de 7-12 ans à la date du recensement qui étaient scolarisés."
    definition_ar: "نسبة الأطفال البالغين 7-12 سنة في تاريخ الإحصاء المسجلين بالمدرسة."
    note: "HCP labels the 2024 group by age during the 2023/24 school year (6-11), which is the 7-12 group at the census date."
    note_fr: "Le HCP désigne le groupe de 2024 par l'âge au cours de l'année scolaire 2023/24 (6-11 ans), ce qui correspond au groupe des 7-12 ans à la date du recensement."
    note_ar: "تصنف المندوبية السامية للتخطيط فئة 2024 حسب السن خلال السنة الدراسية 2023/24 (6-11)، وهي الفئة 7-12 في تاريخ الإحصاء."
  pct_illiterate_15plus:
    theme: "education"
    en: "Illiteracy rate (15+)"
    fr: "Taux d'analphabétisme (15 ans et plus)"
