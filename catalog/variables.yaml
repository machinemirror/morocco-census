  pct_disability:
    theme: "population"
    en: "Disability prevalence"
    fr: "Taux de prévalence du handicap"
    ar: "معدل انتشار الإعاقة"
    unit: "%"
    definition: "Share of the population with a total incapacity or much difficulty in at least one of six functional domains (sight, hearing, mobility, communication, memory, self-care)."
    definition_fr: "Part de la population présentant une incapacité totale ou une grande difficulté dans au moins un des six domaines fonctionnels (vue, ouïe, mobilité, communication, mémoire, soins personnels)."
    definition_ar: "نسبة السكان الذين يعانون من عجز كلي أو صعوبة كبيرة في مجال واحد على الأقل من المجالات الوظيفية الستة (البصر، السمع، الحركة، التواصل، التذكر، العناية الذاتية)."
  pct_single:
    theme: "family"
    en: "Never married"
    fr: "Célibataires"
    ar: "العزاب"
    unit: "%"
    definition: "Share never married in the marital-status distribution."
    definition_fr: "Part des célibataires dans la répartition selon l'état matrimonial."
    definition_ar: "نسبة العزاب في توزيع السكان حسب الحالة الزواجية."
    note: "2004 and 2024 are shares of the population aged 15 and over. HCP's 2014 commune table uses a wider base (never-married is about 53% at the median commune, against 31% in 2024), so 2014 levels are not comparable."
    note_fr: "En 2004 et 2024, parts de la population âgée de 15 ans et plus. Le tableau communal 2014 du HCP utilise une base plus large (environ 53 % de célibataires dans la commune médiane, contre 31 % en 2024) : les niveaux de 2014 ne sont donc pas comparables."
    note_ar: "قيمتا 2004 و2024 نسبتان من السكان البالغين 15 سنة فأكثر. ويعتمد جدول 2014 الجماعي للمندوبية السامية للتخطيط قاعدة أوسع (تبلغ نسبة العزاب نحو 53% في الجماعة الوسيطة، مقابل 31% سنة 2024)، لذا فمستويات 2014 غير قابلة للمقارنة."
    comparable: false
