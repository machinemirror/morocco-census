    theme: "migration"
    en: "Born elsewhere in Morocco (lifetime in-migration)"
    unit: "%"
    definition: "Residents born in another Moroccan commune, as a share of the commune's population."
    note: "Sedentary population (nomadic households and homeless people excluded). Moves between communes; international moves count as exits."
  mig_out_lifetime:
    theme: "migration"
    en: "Natives living elsewhere (lifetime out-migration)"
    unit: "%"
    definition: "People born in the commune who live elsewhere in Morocco or abroad, as a share of all people born there."
    note: "Sedentary population (nomadic households and homeless people excluded). Moves between communes; international moves count as exits."
  mig_in_10y:
    theme: "migration"
