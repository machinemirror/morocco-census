    note: "Sedentary population (nomadic households and homeless people excluded). Moves between communes; international moves count as exits."
  mig_out_10y:
    theme: "migration"
    en: "Left in the last 10 years"
    unit: "%"
    definition: "People who lived in the commune 10 years before the census and now live elsewhere, as a share of those residents."
    note: "Sedentary population (nomadic households and homeless people excluded). Moves between communes; international moves count as exits."
  mig_in_5y:
    theme: "migration"
