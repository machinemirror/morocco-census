      hh_size_avg: {indicator: hh_size_avg, from: "Ménages col 4: Taille moyenne des ménages"}
      pct_owner: {indicator: pct_owner, from: "Ménages col 13: Statut d'occupation, Propriétaire"}
      pct_renter: {indicator: pct_renter, from: "Ménages col 14: Locataire"}
      pct_electricity: {indicator: pct_electricity, from: "Ménages col 23: Électricité"}
      pct_water: {indicator: pct_water, from: "Ménages col 24: Eau courante"}
      is_urban: {indicator: is_urban, from: "Population_Rurale col 3 empty (no rural population)"}
      pop_share: {indicator: pop_share, from: "population24 / national sum x 100"}

  - id: commune_indices_2004
    file: commune_indices_2004.csv
    vintage: 2004
    key: label
    en: 2004 commune poverty and development indices
    fr: Indices communaux de pauvreté et de développement 2004
    description: Annexe 2 of HCP's 2004 poverty and human-development volume, parsed from the PDF.
      One row per printed commune (1,677); labels carry a province prefix.
    source: annex2004
    columns:
      page: {en: PDF page, fr: Page du PDF, unit: page, definition: Page of the source PDF.}
      region: {en: Region (2004), fr: Région (2004), unit: text, definition: Region from the page header (16-region map).}
      label: {en: Printed label, fr: Libellé imprimé, unit: text, definition: "'Province Commune' label as printed."}
      taux_pauvrete: {indicator: poverty_rate, vintage: 2004, from: "Taux de pauvreté"}
      vulnerabilite: {indicator: vulnerability_monetary, vintage: 2004, from: "Vulnérabilité"}
      severite: {indicator: poverty_severity, vintage: 2004, from: "Sévérité"}
      inegalite: {indicator: inequality, vintage: 2004, from: "Inégalité"}
      idh: {indicator: idh, vintage: 2004, from: "Indice de développement humain"}
      ids: {indicator: ids, vintage: 2004, from: "Indice de développement social"}

  - id: panel_commune
    file: panel_commune.csv
    key: code14
    en: Three-census commune panel
    fr: Panel communal des trois recensements
    description: One row per 2014 commune (1,538) plus six population-weighted city aggregates for the
      arrondissement cities. Values missing after post-2004 reorganisations are imputed from the
      same cercle (fallback province), population-weighted, and flagged in src04/src14/src24.
    columns:
      code14: {en: Commune code (2014), fr: Code géographique (2014), unit: code, definition: Crosswalk spine key.}
      name14: {en: Commune name (2014), fr: Nom de la commune (2014), unit: text, definition: "HCP 2014 label; 'CITY ...' for city aggregates."}
      prov14: {en: Province (2014), fr: Province (2014), unit: text, definition: Province or préfecture on the 12-region map.}
      name_carto: {en: Name in the poverty map, fr: Nom dans la carte de la pauvreté, unit: text, definition: Matched commune name in the 2004-2014 poverty map.}
      code24: {en: Commune code (2024), fr: Code géographique (2024), unit: code, definition: Matched 2024 code.}
      name24: {en: Commune name (2024), fr: Nom de la commune (2024), unit: text, definition: Matched 2024 label.}
      label04: {en: 2004 annex label, fr: Libellé de l'annexe 2004, unit: text, definition: Matched label in commune_indices_2004.}
      src04: {en: 2004 value provenance, fr: Provenance des valeurs 2004, unit: flag,
              definition: "direct | fuzzy (name match) | imputed_cercle | imputed_province."}
      src14: {en: 2014 MPI provenance, fr: Provenance MPI 2014, unit: flag, definition: "empty = direct; imputed_cercle | imputed_province."}
      src24: {en: 2024 MPI provenance, fr: Provenance MPI 2024, unit: flag, definition: "empty = direct; imputed_cercle | imputed_province."}
      idh04: {indicator: idh, vintage: 2004, source: annex2004, from: "Annexe 2: IDH"}
