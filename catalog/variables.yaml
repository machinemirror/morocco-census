    key: code24
    en: RGPH 2024 commune indicators
    fr: Indicateurs communaux RGPH 2024
    description: One row per commune (1,503, including the Western Sahara communes), sheets Population and
      Ménages of HCP's 2024 demographic and socio-economic indicators workbook. The six largest cities
      appear as single communes, not arrondissements.
    source: indicateurs2024
    columns:
      code24: {en: Commune code (2024), fr: Code géographique (2024), unit: code,
               definition: HCP numeric geographic code; joins to the crosswalk's code24.}
      name24: {en: Commune name (2024), fr: Nom de la commune (2024), unit: text, definition: "HCP label ('Commune de ...')."}
      population24: {indicator: population, from: "Population col 3: Population municipale"}
      age_0_4: {indicator: age_0_4, from: "Population col 6: Âge quinquennal 0-4 ans"}
      age_5_9: {indicator: age_5_9, from: "Population col 7: 5-9 ans"}
      age_10_14: {indicator: age_10_14, from: "Population col 8: 10-14 ans"}
      pct_illiterate: {indicator: pct_illiterate, from: "Population col 34: Taux d'analphabétisme des 10 ans et plus"}
      pct_no_education: {indicator: pct_no_education, from: "Population col 42: Aucun niveau d'études"}
      activity_rate: {indicator: activity_rate, from: "Population col 56: Taux d'activité des 15 ans et plus"}
      unemployment_rate: {indicator: unemployment_rate, from: "Population col 57: Taux de chômage"}
      pct_women_divorced: {indicator: pct_women_divorced, from: "Population col 149: Divorcé.e"}
