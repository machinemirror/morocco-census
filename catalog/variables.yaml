datasets:
  - id: communes_2004
    file: communes_2004.csv
    vintage: 2004
    key: app_code
    en: RGPH 2004 commune profiles
    description: One row per commune on the pre-2015 16-region map, parsed from the four profile pages (démographie, socio-culturel, économie, habitat) of HCP's Maroc en Chiffres application.
    source: app2004
    columns:
      app_code: {en: App commune code, unit: code, definition: 10-digit commune code of the Maroc en Chiffres app; join to code14 via crosswalk_app2004.}
      milieu04: {en: Milieu (2004 unit), unit: text, definition: "urban for municipalities (MU), arrondissements (AR) and autonomous centres (AC); rural for rural communes (CR). The app reports a rural commune apart from its centres, so a 2014 commune's 2004 urban and rural values come from its units of each kind. These units hold 16,339,561 urban residents, 99.2% of HCP's 2004 urban total."}
      population04: {indicator: population, from: "Démographie: Population totale (effectif)"}
      pct_female: {indicator: pct_female, from: "Démographie: SEXE, Féminin (%)"}
      age_0_4: {indicator: age_0_4, from: "Démographie: Moins de 5 ans (%)"}
      age_5_9: {indicator: age_5_9, from: "Démographie: 5 à 9 ans (%)"}
      age_10_14: {indicator: age_10_14, from: "Démographie: 10 à 14 ans (%)"}
      isf: {indicator: isf, from: "Démographie: Indice synthétique de fécondité"}
      birth_rate: {indicator: birth_rate, from: "Démographie: Taux de natalité"}
      infant_mortality: {indicator: infant_mortality, from: "Démographie: Taux de mortalité infantile"}
