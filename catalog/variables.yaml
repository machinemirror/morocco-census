  age_75plus:
    theme: "age"
    en: "Aged 75 and over"
    fr: "Âgés de 75 ans et plus"
    ar: "الفئة العمرية 75 سنة فأكثر"
    unit: "%"
    definition: "Share of the population aged 75 and over."
  age_60plus:
    theme: "age"
    en: "Aged 60 and over"
    fr: "Âgés de 60 ans et plus"
    ar: "الفئة العمرية 60 سنة فأكثر"
    unit: "%"
    definition: "Share of the population aged 60 and over."
  age_65plus:
    theme: "age"
    en: "Aged 65 and over"
    fr: "Âgés de 65 ans et plus"
    ar: "الفئة العمرية 65 سنة فأكثر"
    unit: "%"
    definition: "Share of the population aged 65 and over."
  pct_disability:
    theme: "population"
    en: "Disability prevalence"
    fr: "Taux de prévalence du handicap"
    ar: "معدل انتشار الإعاقة"
    unit: "%"
    definition: "Share of the population living with a disability."
  pct_single:
    theme: "family"
    en: "Never married"
    fr: "Célibataires"
    ar: "العزاب"
    unit: "%"
    definition: "Share never married in the marital-status distribution."
    note: "2004 and 2024 are shares of the population aged 15 and over. HCP's 2014 commune table uses a wider base (never-married is about 53% at the median commune, against 31% in 2024), so 2014 levels are not comparable."
    comparable: false
  pct_married:
    theme: "family"
    en: "Married"
    fr: "Marié(e)s"
    ar: "المتزوجون"
    unit: "%"
    definition: "Share married in the marital-status distribution."
    note: "2004 and 2024 are shares of the population aged 15 and over. HCP's 2014 commune table uses a wider base (never-married is about 53% at the median commune, against 31% in 2024), so 2014 levels are not comparable."
    comparable: false
  pct_divorced:
    theme: "family"
    en: "Divorced"
    fr: "Divorcé(e)s"
    ar: "المطلقون والمطلقات"
    unit: "%"
    definition: "Share divorced in the marital-status distribution, both sexes."
    note: "2004 and 2024 are shares of the population aged 15 and over. HCP's 2014 commune table uses a wider base (never-married is about 53% at the median commune, against 31% in 2024), so 2014 levels are not comparable."
    comparable: false
  pct_widowed:
    theme: "family"
    en: "Widowed"
    fr: "Veufs et veuves"
    ar: "الأرامل"
    unit: "%"
    definition: "Share widowed in the marital-status distribution."
    note: "2004 and 2024 are shares of the population aged 15 and over. HCP's 2014 commune table uses a wider base (never-married is about 53% at the median commune, against 31% in 2024), so 2014 levels are not comparable."
    comparable: false
  age_first_marriage:
    theme: "family"
    en: "Mean age at first marriage"
    fr: "Âge moyen au premier mariage"
    ar: "متوسط السن عند الزواج الأول"
    unit: "years"
    definition: "Mean age at first marriage."
    note: "2024 is HCP's singulate mean age at marriage (âge moyen singulier au mariage)."
  completed_fertility:
    theme: "fertility"
    en: "Completed fertility"
    fr: "Descendance finale"
    ar: "الخصوبة المكتملة"
    unit: "children per woman"
    definition: "Mean number of children born to women at the end of their reproductive years."
    note: "2014 is the mean parity of women aged 45-49 (parité moyenne à 45-49 ans); 2024 is HCP's descendance finale."
  school_enrolment:
