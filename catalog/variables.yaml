    ar: 'السكان حسب مستوى التعليم: الثانوي الإعدادي'
    label_source: RGPH 2024 results platform, indicator menu (resultats2024.rgphapps.ma, chart 667)
    unit: "%"
    definition: "Share of the population whose highest level of general education is lower-secondary school (collège)."
    note: "2004 is a share of the population aged 25 and over, and HCP's 2004 levels sum to about 96% (a category is not published); 2014 and 2024 are HCP's commune shares on a wider base, so 2004 levels are not comparable."
    comparable: false
  edu_upper_secondary:
    theme: "education"
    en: "Upper-secondary level"
    fr: "Population selon le niveau d'études : Secondaire qualifiant"
    ar: 'السكان حسب مستوى التعليم: الثانوي التأهيلي'
    label_source: RGPH 2024 results platform, indicator menu (resultats2024.rgphapps.ma, chart 667)
    unit: "%"
