# Catalogue of every published column.
#
# indicators: concepts that can be mapped. A concept observed in several censuses has one
#   entry; the columns that measure it point here with `indicator:` and carry the vintage.
# datasets: one entry per published table. Every column is listed. A column either points to
#   an indicator (and gives its vintage and exact source), or describes itself (identifiers).
# `comparable: false` or a `note` flags a definitional break between vintages.
# `agg: sum` marks counts, summed when communes are merged into a map unit; everything else is a
#   population-weighted mean (flags: max).

themes:
  population: {en: Population, fr: Population, ar: السكان}
  age: {en: Age structure, fr: Structure par âge, ar: البنية العمرية}
  fertility: {en: Fertility and mortality, fr: Fécondité et mortalité, ar: الخصوبة والوفيات}
  education: {en: Education and literacy, fr: Éducation et alphabétisation, ar: التعليم ومحو الأمية}
  languages: {en: Languages, fr: "Langues", ar: اللغات}
  employment: {en: Employment, fr: Emploi, ar: الشغل}
  occupation: {en: Occupations and sectors, fr: "Professions et secteurs d'activité", ar: المهن وقطاعات النشاط}
  family: {en: Marital status and migration, fr: État matrimonial et migration, ar: الحالة الزواجية والهجرة}
  housing: {en: Housing, fr: Logement, ar: السكن}
  sanitation: {en: Sanitation, energy and access, fr: "Assainissement, énergie et accès", ar: التطهير والطاقة والولوج}
  equipment: {en: Household equipment, fr: "Équipement des ménages", ar: تجهيزات الأسر}
  poverty: {en: Poverty and human development, fr: Pauvreté et développement humain, ar: الفقر والتنمية البشرية}

indicators:
  population:
    agg: sum
    theme: population
    en: Population
    fr: Population
    ar: السكان
    unit: persons
    definition: Resident population of the commune.
    note: 2004 is the app's 'Population totale'; 2014 and 2024 are 'population municipale' (excludes
      the population comptée à part, e.g. barracks and boarding schools).
  pop_share:
    agg: sum
    theme: population
    en: Share of national population
    fr: Part de la population nationale
    ar: الحصة من سكان المملكة
    unit: "%"
    definition: Commune population divided by the sum over all commune rows, times 100.
  is_urban:
    theme: population
    en: Urban commune
    fr: Commune urbaine
    ar: جماعة حضرية
    unit: flag
    definition: 1 for municipalities and arrondissements, 0 for rural communes.
    note: 2014 uses the '(Mun.)'/'(Arrond.)' suffix of HCP's commune name; 2024 flags communes with no
      rural population. The two agree for every commune matched across both censuses; 2024 has fewer
      urban units because the six arrondissement cities are single communes there.
  n_households:
    agg: sum
    theme: population
    en: Households
    fr: Ménages
    ar: الأسر
    unit: households
    definition: Number of ordinary households.
  hh_size_avg:
    theme: population
    en: Average household size
    fr: Taille moyenne des ménages
    ar: متوسط حجم الأسرة
    unit: persons
    definition: Persons per ordinary household.
  pct_female:
    theme: population
    en: Female share
    fr: Part des femmes
    ar: نسبة الإناث
    unit: "%"
    definition: Women as a share of the population.
  age_0_4:
    theme: age
    en: Aged 0-4
    fr: Âgés de 0-4 ans
    ar: الفئة العمرية 0-4 سنوات
    unit: "%"
    definition: Share of the population aged 0 to 4.
  age_5_9:
    theme: age
    en: Aged 5-9
    fr: Âgés de 5-9 ans
    ar: الفئة العمرية 5-9 سنوات
    unit: "%"
    definition: Share of the population aged 5 to 9.
  age_10_14:
    theme: age
    en: Aged 10-14
    fr: Âgés de 10-14 ans
    ar: الفئة العمرية 10-14 سنة
    unit: "%"
    definition: Share of the population aged 10 to 14.
  isf:
    theme: fertility
    en: Total fertility rate
    fr: Indice synthétique de fécondité
    ar: المؤشر التركيبي للخصوبة
    unit: children per woman
    definition: Children per woman implied by current age-specific fertility.
    note: "2024 is HCP's 'indicateur conjoncturel de fécondité', the same measure under another name."
  birth_rate:
    theme: fertility
    en: Crude birth rate
    fr: Taux de natalité
    ar: معدل الولادات
    unit: per 1,000
    definition: Live births per 1,000 population.
  infant_mortality:
    theme: fertility
    en: Infant mortality rate
    fr: Taux de mortalité infantile
    ar: معدل وفيات الرضع
    unit: per 1,000 births
    definition: Deaths under age one per 1,000 live births.
  pct_illiterate:
    theme: education
    en: Illiteracy rate
    fr: Taux d'analphabétisme
    ar: معدل الأمية
    unit: "%"
    definition: Share of the population aged 10 and over who cannot read and write.
  pct_no_lang_written:
    en: Reads and writes no language
    fr: Ne lit et n'écrit aucune langue
    ar: لا يقرأ ولا يكتب أي لغة
    unit: "%"
    definition: Share answering 'Aucune' to languages read and written. This is the 'illiterate'
      variable of Lehnert (2021) and Lehnert & Smirnov (2024), distinct from the illiteracy rate.
    theme: "languages"
  pct_no_education:
    theme: education
    en: No schooling
    fr: Aucun niveau d'études
    ar: بدون مستوى دراسي
    unit: "%"
    definition: Share of the population with no level of general education.
    note: "2004 shares are of the population aged 25 and over; 2014 and 2024 are HCP's commune shares."
    comparable: false
  pct_no_diploma:
    theme: education
    en: No diploma
    fr: Sans diplôme
    ar: بدون شهادة
    unit: "%"
    definition: Share of the population holding no diploma.
  pct_higher_ed:
    theme: education
    en: Higher-education diploma
    fr: Diplôme de l'enseignement supérieur
    ar: شهادة التعليم العالي
    unit: "%"
    definition: DEUG/Licence plus Master/Doctorat (or equivalent), summed.
  activity_rate:
    theme: employment
    en: Activity rate
    fr: Taux d'activité
    ar: معدل النشاط
    unit: "%"
    definition: Economically active population as a share of the working-age population.
    note: 2004 is the share 'Actifs' in the app's activity table; 2014 is the 'taux net d'activité';
      2024 is the activity rate of those aged 15 and over. Bases differ, so compare levels with care.
    comparable: false
  unemployment_rate:
    theme: employment
    en: Unemployment rate
    fr: Taux de chômage
    ar: معدل البطالة
    unit: "%"
    definition: Unemployed as a share of the active population.
  pop_active_occupee:
    agg: sum
    theme: employment
    en: Employed population (15+)
    fr: Population active occupée (15 ans et plus)
    ar: السكان النشيطون المشتغلون (15 سنة فأكثر)
    unit: persons
    definition: Employed persons aged 15 and over.
  pct_agriculture:
    en: Employed in agriculture
    fr: Actifs occupés dans l'agriculture
    ar: النشيطون المشتغلون في الفلاحة
    unit: "%"
    definition: Share of employed persons working in agriculture, forestry and fishing.
    theme: "occupation"
    note: "2004 shares are of employed persons and unemployed persons who have worked before, by branch; 2014 shares are of employed persons aged 15 and over."
    comparable: false
  pct_women_divorced:
    theme: family
    unit: "%"
    en: "Divorced women"
    fr: "Femmes divorcées"
    ar: "النساء المطلقات"
    definition: "Share of women aged 15 and over who are divorced."
    note: "2004 is computed from the female counts of the marital-status table; 2014 and 2024 are HCP's female 'Divorcé' shares. The 2014 base is wider than 15 and over (see Divorced)."
    comparable: false
  pct_migrant_since99:
    theme: family
    en: Moved in since 1999
    fr: Résidait dans une autre commune en 1999
    ar: كان يقيم في جماعة أخرى سنة 1999
    unit: "%"
    definition: Share whose 1999 residence was a different commune.
  pct_owner:
    theme: housing
    en: Owner-occupied households
    fr: Ménages propriétaires
    ar: الأسر المالكة
    unit: "%"
    definition: Share of households owning their dwelling.
  pct_renter:
    theme: housing
    en: Renting households
    fr: Ménages locataires
    ar: الأسر المكترية
    unit: "%"
    definition: Share of households renting their dwelling.
  pct_electricity:
    theme: housing
    en: Electricity
    fr: Électricité
    ar: الكهرباء
    unit: "%"
    definition: Share of households with electricity.
  pct_water:
    theme: housing
    en: Piped water
    fr: Eau courante
    ar: الماء الجاري
    unit: "%"
    definition: Share of households with running water.
  pct_cellphone:
    en: Mobile phone
    fr: Téléphone portable
    ar: الهاتف المحمول
    unit: "%"
    definition: Share of households with a mobile phone. Not published at commune level for 2024.
    theme: "equipment"
  pct_internet:
    en: Internet
    fr: Internet
    ar: الإنترنت
    unit: "%"
    definition: Share of households with internet access. Not published at commune level for 2024.
    theme: "equipment"
  pct_tv:
    en: Television
    fr: Télévision
    ar: التلفاز
    unit: "%"
    definition: Share of households with a television.
    theme: "equipment"
  pct_slum:
    theme: housing
    en: Makeshift housing or slum
    fr: Maison sommaire ou bidonville
    ar: مسكن بدائي أو صفيحي
    unit: "%"
    definition: Share of households living in a makeshift dwelling or slum.
    note: "2014 category is 'Habitat sommaire'."
  idh:
    theme: poverty
    en: Human development index (IDH)
    fr: Indice de développement humain (IDH)
    ar: مؤشر التنمية البشرية
    unit: index 0-1
    definition: HCP's commune human development index (education, health, standard of living).
  ids:
    theme: poverty
    en: Social development index (IDS)
    fr: Indice de développement social (IDS)
    ar: مؤشر التنمية الاجتماعية
    unit: index 0-1
    definition: HCP's commune social development index. Not computed for urban municipalities (390 missing).
  poverty_rate:
    theme: poverty
    en: Monetary poverty rate
    fr: Taux de pauvreté
    ar: معدل الفقر
    unit: "%"
    definition: Share of the population below the monetary poverty line (small-area estimate).
  vulnerability_monetary:
    theme: poverty
    en: Monetary vulnerability
    fr: Taux de vulnérabilité
    ar: معدل الهشاشة
    unit: "%"
    definition: Share of the population between the poverty line and 1.5 times it.
  poverty_severity:
    theme: poverty
    en: Poverty severity
    fr: Sévérité de la pauvreté
    ar: حدة الفقر
    unit: index
    definition: Squared poverty gap (FGT2).
  inequality:
    theme: poverty
    en: Inequality
    fr: Inégalité
    ar: مؤشر اللامساواة
    unit: index
    definition: Inequality index as printed in HCP's 2004 annex.
  mpi_carto:
    theme: poverty
    en: Multidimensional poverty index (poverty map)
    fr: Indice de pauvreté multidimensionnelle (carte de la pauvreté)
    ar: مؤشر الفقر متعدد الأبعاد (خريطة الفقر)
    unit: "%"
    definition: MPI (H x A) from HCP's 2004-2014 commune poverty map, expressed in percent.
    note: Not the same methodology or scale as the 2014/2024 MPI database; do not mix the two series.
  mpi_rate_carto:
    theme: poverty
    en: Multidimensional poverty rate (poverty map)
    fr: Taux de pauvreté multidimensionnelle (carte de la pauvreté)
    ar: معدل الفقر متعدد الأبعاد (خريطة الفقر)
    unit: "%"
    definition: Headcount H from HCP's 2004-2014 poverty map.
  mpi_intensity_carto:
    theme: poverty
    en: Intensity of deprivation (poverty map)
    fr: Intensité de privation des pauvres (carte de la pauvreté)
    ar: شدة الحرمان لدى الفقراء (خريطة الفقر)
    unit: "%"
    definition: Average deprivation share A among the poor, 2004-2014 poverty map.
  poverty_global_carto:
    theme: poverty
    en: Overall poverty rate (poverty map)
    fr: Taux de pauvreté globale (carte de la pauvreté)
    ar: معدل الفقر الإجمالي (خريطة الفقر)
    unit: "%"
    definition: Share poor in monetary or multidimensional terms, 2014 poverty map.
  mpi:
    theme: poverty
    en: Multidimensional poverty index
    fr: Indice de pauvreté multidimensionnelle (MPI)
    ar: مؤشر الفقر متعدد الأبعاد (MPI)
    unit: index 0-1
    definition: MPI = H x A from HCP's May-2025 database, computed on the same basis for 2014 and 2024.
  mpi_rate:
    theme: poverty
    en: Multidimensional poverty rate
    fr: Taux de pauvreté multidimensionnelle
    ar: معدل الفقر متعدد الأبعاد
    unit: "%"
    definition: Headcount H, share of the population in multidimensional poverty.
  mpi_intensity:
    theme: poverty
    en: Intensity of multidimensional poverty
    fr: Intensité de la pauvreté multidimensionnelle
    ar: شدة الفقر متعدد الأبعاد
    unit: "%"
    definition: Average deprivation share A among the multidimensionally poor.
  vulnerability:
    theme: poverty
    en: Vulnerability to multidimensional poverty
    fr: Taux de vulnérabilité à la pauvreté
    ar: معدل الهشاشة إزاء الفقر
    unit: "%"
    definition: Share of the population vulnerable to multidimensional poverty.

  age_15_19:
    theme: "age"
    en: "Aged 15-19"
    fr: "Âgés de 15-19 ans"
    ar: "الفئة العمرية 15-19 سنة"
    unit: "%"
    definition: "Share of the population aged 15 to 19."
  age_20_24:
    theme: "age"
    en: "Aged 20-24"
    fr: "Âgés de 20-24 ans"
    ar: "الفئة العمرية 20-24 سنة"
    unit: "%"
    definition: "Share of the population aged 20 to 24."
  age_25_29:
    theme: "age"
