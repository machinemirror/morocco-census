    fr: "Âgés de 25-29 ans"
    ar: "الفئة العمرية 25-29 سنة"
    unit: "%"
    definition: "Share of the population aged 25 to 29."
  age_30_34:
    theme: "age"
    en: "Aged 30-34"
    fr: "Âgés de 30-34 ans"
    ar: "الفئة العمرية 30-34 سنة"
    unit: "%"
    definition: "Share of the population aged 30 to 34."
  age_35_39:
    theme: "age"
    en: "Aged 35-39"
    fr: "Âgés de 35-39 ans"
    ar: "الفئة العمرية 35-39 سنة"
    unit: "%"
    definition: "Share of the population aged 35 to 39."
  age_40_44:
    theme: "age"
    en: "Aged 40-44"
    fr: "Âgés de 40-44 ans"
    ar: "الفئة العمرية 40-44 سنة"
    unit: "%"
    definition: "Share of the population aged 40 to 44."
  age_45_49:
    theme: "age"
    en: "Aged 45-49"
    fr: "Âgés de 45-49 ans"
    ar: "الفئة العمرية 45-49 سنة"
    unit: "%"
    definition: "Share of the population aged 45 to 49."
  age_50_54:
    theme: "age"
    en: "Aged 50-54"
    fr: "Âgés de 50-54 ans"
