# Catalogue of every published column.
#
# indicators: concepts that can be mapped. A concept observed in several censuses has one
#   entry; the columns that measure it point here with `indicator:` and carry the vintage.
# datasets: one entry per published table. Every column is listed. A column either points to
#   an indicator (and gives its vintage and exact source), or describes itself (identifiers).
# `comparable: false` or a `note` flags a definitional break between vintages.
# `agg: sum` marks counts, summed when communes are merged into a map unit; everything else is a
#   population-weighted mean (flags: max), or household-weighted with `weight: households`.

themes:
  population: {en: Population, fr: Population, ar: السكان}
  age: {en: Age structure, fr: Structure par âge, ar: البنية العمرية}
  fertility: {en: Fertility and mortality, fr: Fécondité et mortalité, ar: الخصوبة والوفيات}
  education: {en: Education and literacy, fr: Éducation et alphabétisation, ar: التعليم ومحو الأمية}
  languages: {en: Languages, fr: "Langues", ar: اللغات}
  employment: {en: Employment, fr: Emploi, ar: الشغل}
  occupation: {en: Occupations and sectors, fr: "Professions et secteurs d'activité", ar: المهن وقطاعات النشاط}
  commuting: {en: "Commuting", fr: "Déplacements domicile-travail", ar: "التنقل بين السكن ومقر العمل"}
  establishments: {en: "Economic establishments", fr: "Établissements économiques", ar: "المؤسسات الاقتصادية"}
  family: {en: Marital status, fr: État matrimonial, ar: الحالة الزواجية}
  migration: {en: "Migration", fr: "Migration", ar: "الهجرة"}
  housing: {en: Housing, fr: Logement, ar: السكن}
  urban_housing: {en: "Urban housing stock", fr: "Parc de logements urbains", ar: "الرصيد السكني الحضري"}
  sanitation: {en: "Sanitation, energy and access", fr: "Assainissement, énergie et accès", ar: التطهير والطاقة والولوج}
  equipment: {en: Household equipment, fr: "Équipement des ménages", ar: تجهيزات الأسر}
  rural_settlement: {en: "Rural douars", fr: "Douars ruraux", ar: "الدواوير القروية"}
  poverty: {en: Poverty and human development, fr: Pauvreté et développement humain, ar: الفقر والتنمية البشرية}

indicators:
  population:
    agg: sum
    theme: population
    en: Population
    fr: Population
    ar: السكان
    unit: persons
    definition: Resident population of the commune.
    definition_fr: "Population résidente de la commune."
    definition_ar: "السكان المقيمون بالجماعة."
    note: 2004 is the app's 'Population totale'; 2014 and 2024 are 'population municipale' (excludes
      the population comptée à part, e.g. barracks and boarding schools).
    note_fr: "Pour 2004, 'Population totale' de l'application ; pour 2014 et 2024, 'population municipale' (hors population comptée à part, par exemple casernes et internats)."
    note_ar: "قيمة 2004 هي «مجموع السكان» في التطبيق (Population totale)؛ وقيمتا 2014 و2024 هما «السكان البلديون» (population municipale)، أي دون احتساب السكان المحسوبين على حدة (population comptée à part)، مثل الثكنات والداخليات."
  pop_share:
    agg: sum
    theme: population
    en: Share of national population
    fr: Part de la population nationale
    ar: الحصة من سكان المملكة
    unit: "%"
    definition: Commune population divided by the sum over all commune rows, times 100.
    definition_fr: "Population de la commune divisée par la somme de toutes les lignes de communes, multipliée par 100."
    definition_ar: "سكان الجماعة مقسومين على مجموع سكان كل صفوف الجماعات، مضروبا في 100."
  is_urban:
    theme: population
    en: Urban commune
    fr: Commune urbaine
    ar: جماعة حضرية
    unit: flag
    definition: 1 for municipalities and arrondissements, 0 for rural communes.
    definition_fr: "1 pour les municipalités et les arrondissements, 0 pour les communes rurales."
    definition_ar: "1 للبلديات والمقاطعات، و0 للجماعات القروية."
    note: 2014 uses the '(Mun.)'/'(Arrond.)' suffix of HCP's commune name; 2024 flags communes with no
      rural population. The two agree for every commune matched across both censuses; 2024 has fewer
      urban units because the six arrondissement cities are single communes there.
    note_fr: "En 2014, d'après le suffixe '(Mun.)'/'(Arrond.)' du nom de commune du HCP ; en 2024, sont signalées les communes sans population rurale. Les deux concordent pour toutes les communes appariées entre les deux recensements ; 2024 compte moins d'unités urbaines car les six villes à arrondissements y sont des communes uniques."
    note_ar: "تعتمد سنة 2014 على اللاحقة «(Mun.)» أو «(Arrond.)» في اسم الجماعة لدى المندوبية السامية للتخطيط؛ وتصنّف سنة 2024 كحضرية الجماعات التي لا يوجد بها سكان قرويون. ويتطابق التصنيفان في كل الجماعات المتقابلة بين الإحصاءين؛ ويقل عدد الوحدات الحضرية في 2024 لأن المدن الست المقسمة إلى مقاطعات تظهر فيها كجماعات موحدة."
  n_households:
    agg: sum
    theme: population
    en: Households
    fr: Ménages
    ar: الأسر
    unit: households
    definition: Number of ordinary households.
    definition_fr: "Nombre de ménages ordinaires."
    definition_ar: "عدد الأسر العادية."
  hh_size_avg:
    weight: households
    theme: population
    en: Average household size
    fr: Taille moyenne des ménages
    ar: متوسط حجم الأسرة
    unit: persons
    definition: Persons per ordinary household.
    definition_fr: "Nombre de personnes par ménage ordinaire."
    definition_ar: "عدد الأفراد في الأسرة العادية."
  pct_female:
    theme: population
    en: Female share
    fr: Part des femmes
    ar: نسبة الإناث
    unit: "%"
    definition: Women as a share of the population.
    definition_fr: "Part des femmes dans la population."
    definition_ar: "نسبة النساء من مجموع السكان."
    note: "2014 is computed from HCP's female and total population municipale."
    note_fr: "Pour 2014, calculé à partir de la population municipale féminine et totale du HCP."
    note_ar: "حُسبت قيمة 2014 انطلاقا من عدد الإناث ومجموع السكان البلديين (population municipale) لدى المندوبية السامية للتخطيط."
  age_0_4:
    theme: age
    en: Aged 0-4
    fr: Âgés de 0-4 ans
    ar: الفئة العمرية 0-4 سنوات
    unit: "%"
    definition: Share of the population aged 0 to 4.
    definition_fr: "Part de la population âgée de 0 à 4 ans."
    definition_ar: "نسبة السكان البالغين من العمر 0 إلى 4 سنوات."
  age_5_9:
    theme: age
    en: Aged 5-9
    fr: Âgés de 5-9 ans
    ar: الفئة العمرية 5-9 سنوات
    unit: "%"
    definition: Share of the population aged 5 to 9.
    definition_fr: "Part de la population âgée de 5 à 9 ans."
    definition_ar: "نسبة السكان البالغين من العمر 5 إلى 9 سنوات."
  age_10_14:
    theme: age
    en: Aged 10-14
    fr: Âgés de 10-14 ans
    ar: الفئة العمرية 10-14 سنة
    unit: "%"
    definition: Share of the population aged 10 to 14.
    definition_fr: "Part de la population âgée de 10 à 14 ans."
    definition_ar: "نسبة السكان البالغين من العمر 10 إلى 14 سنة."
  isf:
    theme: fertility
    en: Total fertility rate
    fr: Indice synthétique de fécondité
    ar: المؤشر التركيبي للخصوبة
    unit: children per woman
    definition: "Mean number of live births a woman would have at the fertility rates of the 12 months before the census."
    definition_fr: "Nombre moyen de naissances vivantes qu'aurait une femme selon les taux de fécondité des 12 mois précédant le recensement."
    definition_ar: "متوسط عدد المواليد الأحياء الذين ستنجبهم المرأة وفق معدلات الخصوبة المسجلة خلال 12 شهرا السابقة للإحصاء."
    note: "2024 is HCP's 'indicateur conjoncturel de fécondité', the same measure under another name."
    note_fr: "Pour 2024 : 'indicateur conjoncturel de fécondité' du HCP, même mesure sous un autre nom."
    note_ar: "قيمة 2024 هي «المؤشر الظرفي للخصوبة» لدى المندوبية السامية للتخطيط (indicateur conjoncturel de fécondité)، وهو المقياس نفسه تحت تسمية أخرى."
  birth_rate:
    theme: fertility
    en: Crude birth rate
    fr: Taux de natalité
    ar: معدل الولادات
    unit: per 1,000
    definition: Live births per 1,000 population.
    definition_fr: "Naissances vivantes pour 1 000 habitants."
    definition_ar: "عدد المواليد الأحياء لكل 1000 نسمة."
  infant_mortality:
    theme: fertility
    en: Infant mortality rate
    fr: Taux de mortalité infantile
    ar: معدل وفيات الرضع
    unit: per 1,000 births
    definition: Deaths under age one per 1,000 live births.
    definition_fr: "Décès d'enfants de moins d'un an pour 1 000 naissances vivantes."
    definition_ar: "عدد الوفيات دون سن السنة الواحدة لكل 1000 مولود حي."
  pct_illiterate:
    theme: education
    en: Illiteracy rate
    fr: Taux d'analphabétisme
    ar: معدل الأمية
    unit: "%"
    definition: Share of the population aged 10 and over who cannot read and write.
    definition_fr: "Part de la population âgée de 10 ans et plus ne sachant ni lire ni écrire."
    definition_ar: "نسبة السكان البالغين 10 سنوات فأكثر الذين لا يعرفون القراءة والكتابة."
  pct_no_lang_written:
    theme: "languages"
    en: Reads and writes no language
    fr: Ne lit et n'écrit aucune langue
    ar: لا يقرأ ولا يكتب أي لغة
    unit: "%"
    definition: Share answering 'Aucune' to languages read and written. This is the 'illiterate'
      variable of Lehnert (2021) and Lehnert & Smirnov (2024), distinct from the illiteracy rate.
    definition_fr: "Part ayant répondu 'Aucune' aux langues lues et écrites. Il s'agit de la variable 'illiterate' de Lehnert (2021) et de Lehnert & Smirnov (2024), distincte du taux d'analphabétisme."
    definition_ar: "نسبة الذين أجابوا «لا شيء» (Aucune) عن سؤال اللغات المقروءة والمكتوبة. وهو متغير «illiterate» لدى Lehnert (2021) وLehnert & Smirnov (2024)، وهو مختلف عن معدل الأمية."
  pct_no_education:
    theme: education
    en: No schooling
    fr: Aucun niveau d'études
    ar: بدون مستوى دراسي
    unit: "%"
    definition: "Share of the population with no level of general education."
    definition_fr: "Part de la population n'ayant aucun niveau d'enseignement général."
    definition_ar: "نسبة السكان الذين ليس لهم أي مستوى دراسي في التعليم العام."
    note: "2004 is a share of the population aged 25 and over, and HCP's 2004 levels sum to about 96% (a category is not published); 2014 and 2024 are HCP's commune shares on a wider base, so 2004 levels are not comparable."
    note_fr: "En 2004, part de la population âgée de 25 ans et plus ; les niveaux 2004 du HCP totalisent environ 96 % (une catégorie n'est pas publiée). En 2014 et 2024, parts communales du HCP sur une base plus large : les niveaux de 2004 ne sont donc pas comparables."
    note_ar: "قيمة 2004 نسبة من السكان البالغين 25 سنة فأكثر، ومجموع مستويات 2004 لدى المندوبية السامية للتخطيط يقارب 96% (فئة واحدة غير منشورة)؛ أما قيمتا 2014 و2024 فهما نسب المندوبية على مستوى الجماعة على قاعدة أوسع، لذا فمستويات 2004 غير قابلة للمقارنة."
    comparable: false
  pct_no_diploma:
    theme: education
    en: No diploma
    fr: Sans diplôme
    ar: بدون شهادة
    unit: "%"
    definition: "Share of the population aged 10 and over with no general-education diploma."
    definition_fr: "Part de la population âgée de 10 ans et plus sans diplôme de l'enseignement général."
    definition_ar: "نسبة السكان البالغين 10 سنوات فأكثر الذين لا يتوفرون على أي شهادة في التعليم العام."
  pct_higher_ed:
    theme: education
    en: Higher-education diploma
    fr: Diplôme de l'enseignement supérieur
    ar: شهادة التعليم العالي
    unit: "%"
    definition: "Share of the population aged 10 and over whose highest diploma is a DEUG, licence, master, doctorate or equivalent (sum of the two diploma indicators)."
    definition_fr: "Part de la population âgée de 10 ans et plus dont le plus haut diplôme est un DEUG, une licence, un master, un doctorat ou équivalent (somme des deux indicateurs de diplôme)."
    definition_ar: "نسبة السكان البالغين 10 سنوات فأكثر الذين أعلى شهادة لديهم هي DEUG أو الإجازة أو الماستر أو الدكتوراه أو ما يعادلها (مجموع مؤشري الشهادتين)."
  activity_rate:
    theme: employment
    en: Activity rate
    fr: Taux d'activité
    ar: معدل النشاط
    unit: "%"
    definition: Economically active population as a share of the working-age population.
    definition_fr: "Population active rapportée à la population en âge de travailler."
    definition_ar: "نسبة السكان النشيطين من السكان في سن النشاط."
    note: 2004 is the share 'Actifs' in the app's activity table; 2014 is the 'taux net d'activité';
      2024 is the activity rate of those aged 15 and over. Bases differ, so compare levels with care.
    note_fr: "En 2004, part des 'Actifs' dans le tableau d'activité de l'application ; en 2014, 'taux net d'activité' ; en 2024, taux d'activité des 15 ans et plus. Les bases diffèrent : comparer les niveaux avec prudence."
    note_ar: "قيمة 2004 هي نسبة «النشيطين» (Actifs) في جدول النشاط بالتطبيق؛ وقيمة 2014 هي «معدل النشاط الصافي» (taux net d'activité)؛ وقيمة 2024 هي معدل نشاط السكان البالغين 15 سنة فأكثر. تختلف القواعد، لذا ينبغي الحذر عند مقارنة المستويات."
    comparable: false
  unemployment_rate:
    theme: employment
    en: Unemployment rate
    fr: Taux de chômage
    ar: معدل البطالة
    unit: "%"
    definition: "Unemployed persons as a share of the active population aged 15 and over."
    definition_fr: "Chômeurs rapportés à la population active âgée de 15 ans et plus."
    definition_ar: "نسبة العاطلين من السكان النشيطين البالغين 15 سنة فأكثر."
  pop_active_occupee:
    agg: sum
    theme: employment
    en: Employed population (15+)
    fr: Population active occupée (15 ans et plus)
    ar: السكان النشيطون المشتغلون (15 سنة فأكثر)
    unit: persons
    definition: Employed persons aged 15 and over.
    definition_fr: "Actifs occupés âgés de 15 ans et plus."
    definition_ar: "النشيطون المشتغلون البالغون 15 سنة فأكثر."
  pct_agriculture:
    theme: "occupation"
    en: "Agriculture, forestry and fishing"
    fr: "Agriculture, sylviculture et pêche"
    ar: "الفلاحة والغابات والصيد البحري"
    unit: "%"
    definition: "Share of employed persons working in agriculture, forestry and fishing."
    definition_fr: "Part des actifs occupés travaillant dans l'agriculture, la sylviculture et la pêche."
    definition_ar: "نسبة النشيطين المشتغلين في الفلاحة والغابات والصيد البحري."
    note: "2004 is a share of employed persons plus unemployed persons who have worked before; 2014 is a share of employed persons aged 15 and over."
    note_fr: "En 2004, part des actifs occupés et des chômeurs ayant déjà travaillé ; en 2014, part des actifs occupés âgés de 15 ans et plus."
    note_ar: "قيمة 2004 نسبة من النشيطين المشتغلين مضافا إليهم العاطلين الذين سبق لهم أن اشتغلوا؛ وقيمة 2014 نسبة من النشيطين المشتغلين البالغين 15 سنة فأكثر."
    comparable: false
  pct_women_divorced:
    theme: family
    en: "Divorced women"
    fr: "Femmes divorcées"
    ar: "النساء المطلقات"
    unit: "%"
    definition: "Share of women aged 15 and over who are divorced."
    definition_fr: "Part des femmes âgées de 15 ans et plus qui sont divorcées."
    definition_ar: "نسبة النساء المطلقات من النساء البالغات 15 سنة فأكثر."
    note: "2004 is computed from the female counts of the marital-status table; 2014 and 2024 are HCP's female 'Divorcé' shares. The 2014 base is wider than 15 and over (see Divorced)."
    note_fr: "En 2004, calculé à partir des effectifs féminins du tableau de l'état matrimonial ; en 2014 et 2024, parts féminines 'Divorcé' du HCP. La base de 2014 est plus large que les 15 ans et plus (voir Divorcé(e)s)."
    note_ar: "حُسبت قيمة 2004 انطلاقا من أعداد الإناث في جدول الحالة الزواجية؛ وقيمتا 2014 و2024 هما نسب «المطلقات» (Divorcé) لدى المندوبية السامية للتخطيط. قاعدة 2014 أوسع من فئة 15 سنة فأكثر (انظر المطلقون والمطلقات)."
    comparable: false
  pct_migrant_since99:
    theme: migration
    en: Moved in since 1999
    fr: Résidait dans une autre commune en 1999
    ar: كان يقيم في جماعة أخرى سنة 1999
    unit: "%"
    definition: Share whose 1999 residence was a different commune.
    definition_fr: "Part dont la résidence en 1999 se trouvait dans une autre commune."
    definition_ar: "نسبة الذين كانوا يقيمون سنة 1999 في جماعة أخرى."
  pct_owner:
    weight: households
    theme: housing
    en: Owner-occupied households
    fr: Ménages propriétaires
    ar: الأسر المالكة
    unit: "%"
    definition: Share of households owning their dwelling.
    definition_fr: "Part des ménages propriétaires de leur logement."
    definition_ar: "نسبة الأسر المالكة لمسكنها."
  pct_renter:
    weight: households
    theme: housing
    en: Renting households
    fr: Ménages locataires
    ar: الأسر المكترية
    unit: "%"
    definition: Share of households renting their dwelling.
    definition_fr: "Part des ménages locataires de leur logement."
    definition_ar: "نسبة الأسر المكترية لمسكنها."
  pct_electricity:
    weight: households
    theme: housing
    en: Electricity
    fr: Électricité
    ar: الكهرباء
    unit: "%"
    definition: Share of households with electricity.
    definition_fr: "Part des ménages disposant de l'électricité."
    definition_ar: "نسبة الأسر التي تتوفر على الكهرباء."
    note: "2024 counts households connected to the public grid or lit by solar power or a generator."
    note_fr: "En 2024, sont comptés les ménages raccordés au réseau public ou éclairés à l'énergie solaire ou par un groupe électrogène."
    note_ar: "تحتسب قيمة 2024 الأسر المرتبطة بالشبكة العمومية أو التي تستعمل الطاقة الشمسية أو مولدا كهربائيا للإنارة."
  pct_water:
    weight: households
    theme: housing
    en: Piped water
    fr: Eau courante
    ar: الماء الجاري
    unit: "%"
    definition: "Share of households whose dwelling is connected to a piped water network."
    definition_fr: "Part des ménages dont le logement est raccordé à un réseau de distribution d'eau courante."
    definition_ar: "نسبة الأسر التي يرتبط مسكنها بشبكة الماء الجاري."
  pct_cellphone:
    weight: households
    theme: "equipment"
    en: Mobile phone
    fr: Téléphone portable
    ar: الهاتف المحمول
    unit: "%"
    definition: "Share of households with a mobile phone."
    definition_fr: "Part des ménages disposant d'un téléphone portable."
    definition_ar: "نسبة الأسر التي تتوفر على هاتف محمول."
    note: "Household equipment is not published at commune level for 2024."
    note_fr: "L'équipement des ménages n'est pas publié au niveau communal pour 2024."
    note_ar: "تجهيزات الأسر غير منشورة على مستوى الجماعة بالنسبة لسنة 2024."
  pct_internet:
    weight: households
    theme: "equipment"
    en: Internet
    fr: Internet
    ar: الإنترنت
    unit: "%"
    definition: "Share of households with internet access."
    definition_fr: "Part des ménages ayant accès à internet."
    definition_ar: "نسبة الأسر التي تتوفر على الولوج إلى الإنترنت."
    note: "Household equipment is not published at commune level for 2024."
    note_fr: "L'équipement des ménages n'est pas publié au niveau communal pour 2024."
    note_ar: "تجهيزات الأسر غير منشورة على مستوى الجماعة بالنسبة لسنة 2024."
  pct_tv:
    weight: households
    theme: "equipment"
    en: Television
    fr: Télévision
    ar: التلفاز
    unit: "%"
    definition: "Share of households with a television."
    definition_fr: "Part des ménages disposant d'un téléviseur."
    definition_ar: "نسبة الأسر التي تتوفر على جهاز تلفاز."
    note: "Household equipment is not published at commune level for 2024."
    note_fr: "L'équipement des ménages n'est pas publié au niveau communal pour 2024."
    note_ar: "تجهيزات الأسر غير منشورة على مستوى الجماعة بالنسبة لسنة 2024."
  pct_slum:
    theme: housing
    en: Makeshift housing or slum
    fr: Maison sommaire ou bidonville
    ar: مسكن بدائي أو صفيحي
    unit: "%"
    definition: "Share of households living in a makeshift dwelling or a slum (maison sommaire, bidonville)."
    definition_fr: "Part des ménages vivant dans une maison sommaire ou un bidonville."
    definition_ar: "نسبة الأسر القاطنة في مسكن بدائي أو صفيحي (maison sommaire, bidonville)."
    note: "2014 category is 'Habitat sommaire'. In 89 communes HCP's 2004 dwelling-type shares sum to less than 100% as published."
    note_fr: "En 2014, la catégorie est 'Habitat sommaire'. Dans 89 communes, les parts des types de logement de 2004 publiées par le HCP totalisent moins de 100 %."
    note_ar: "فئة 2014 هي «السكن البدائي» (Habitat sommaire). وفي 89 جماعة يقل مجموع نسب أنواع المساكن لسنة 2004 كما نشرتها المندوبية السامية للتخطيط عن 100%."
  idh:
    theme: poverty
    en: Human development index (IDH)
    fr: Indice de développement humain (IDH)
    ar: مؤشر التنمية البشرية
    unit: index 0-1
    definition: HCP's commune human development index (education, health, standard of living).
    definition_fr: "Indice de développement humain communal du HCP (éducation, santé, niveau de vie)."
    definition_ar: "مؤشر التنمية البشرية على مستوى الجماعة لدى المندوبية السامية للتخطيط (التعليم والصحة ومستوى المعيشة)."
  ids:
    theme: poverty
    en: Social development index (IDS)
    fr: Indice de développement social (IDS)
    ar: مؤشر التنمية الاجتماعية
    unit: index 0-1
    definition: HCP's commune social development index. Not computed for urban municipalities (390 missing).
    definition_fr: "Indice de développement social communal du HCP. Non calculé pour les municipalités urbaines (390 valeurs manquantes)."
    definition_ar: "مؤشر التنمية الاجتماعية على مستوى الجماعة لدى المندوبية السامية للتخطيط. لا يُحتسب للبلديات الحضرية (390 قيمة مفقودة)."
  poverty_rate:
    theme: poverty
    en: Monetary poverty rate
    fr: Taux de pauvreté
    ar: معدل الفقر
    unit: "%"
    definition: Share of the population below the monetary poverty line (small-area estimate).
    definition_fr: "Part de la population sous le seuil de pauvreté monétaire (estimation sur petits domaines)."
    definition_ar: "نسبة السكان الموجودين تحت خط الفقر النقدي (تقدير على مستوى المجالات الصغرى)."
  vulnerability_monetary:
    theme: poverty
    en: Monetary vulnerability
    fr: Taux de vulnérabilité
    ar: معدل الهشاشة
    unit: "%"
    definition: Share of the population between the poverty line and 1.5 times it.
    definition_fr: "Part de la population située entre le seuil de pauvreté et 1,5 fois ce seuil."
    definition_ar: "نسبة السكان الذين يقع مستوى عيشهم بين خط الفقر و1.5 مرة هذا الخط."
  poverty_severity:
    theme: poverty
    en: Poverty severity
    fr: Sévérité de la pauvreté
    ar: حدة الفقر
    unit: index
    definition: Squared poverty gap (FGT2).
    definition_fr: "Écart de pauvreté au carré (FGT2)."
    definition_ar: "مربع فجوة الفقر (FGT2)."
  inequality:
    theme: poverty
    en: Inequality
    fr: Inégalité
    ar: مؤشر اللامساواة
    unit: index
    definition: Inequality index as printed in HCP's 2004 annex.
    definition_fr: "Indice d'inégalité tel qu'imprimé dans l'annexe 2004 du HCP."
    definition_ar: "مؤشر اللامساواة كما ورد في ملحق 2004 للمندوبية السامية للتخطيط."
  mpi_carto:
    theme: poverty
    en: Multidimensional poverty index (poverty map)
    fr: Indice de pauvreté multidimensionnelle (carte de la pauvreté)
    ar: مؤشر الفقر متعدد الأبعاد (خريطة الفقر)
    unit: "%"
    definition: MPI (H x A) from HCP's 2004-2014 commune poverty map, expressed in percent.
    definition_fr: "IPM (H x A) issu de la carte communale de la pauvreté 2004-2014 du HCP, exprimé en pourcentage."
    definition_ar: "مؤشر الفقر متعدد الأبعاد MPI (H x A) من خريطة الفقر الجماعية 2004-2014 للمندوبية السامية للتخطيط، معبرا عنه بالنسبة المئوية."
    note: Not the same methodology or scale as the 2014/2024 MPI database; do not mix the two series.
    note_fr: "Méthodologie et échelle différentes de celles de la base de données MPI 2014/2024 ; ne pas combiner les deux séries."
    note_ar: "ليس بنفس المنهجية ولا بنفس السلم المعتمدين في قاعدة بيانات MPI لسنتي 2014/2024؛ لا ينبغي الخلط بين السلسلتين."
  mpi_rate_carto:
    theme: poverty
    en: Multidimensional poverty rate (poverty map)
    fr: Taux de pauvreté multidimensionnelle (carte de la pauvreté)
    ar: معدل الفقر متعدد الأبعاد (خريطة الفقر)
    unit: "%"
    definition: Headcount H from HCP's 2004-2014 poverty map.
    definition_fr: "Incidence H issue de la carte de la pauvreté 2004-2014 du HCP."
    definition_ar: "نسبة الفقراء H من خريطة الفقر 2004-2014 للمندوبية السامية للتخطيط."
  mpi_intensity_carto:
    theme: poverty
    en: Intensity of deprivation (poverty map)
    fr: Intensité de privation des pauvres (carte de la pauvreté)
    ar: شدة الحرمان لدى الفقراء (خريطة الفقر)
    unit: "%"
    definition: Average deprivation share A among the poor, 2004-2014 poverty map.
    definition_fr: "Part moyenne des privations A parmi les pauvres, carte de la pauvreté 2004-2014."
    definition_ar: "متوسط نسبة الحرمان A لدى الفقراء، خريطة الفقر 2004-2014."
  poverty_global_carto:
    theme: poverty
    en: Overall poverty rate (poverty map)
    fr: Taux de pauvreté globale (carte de la pauvreté)
    ar: معدل الفقر الإجمالي (خريطة الفقر)
    unit: "%"
    definition: Share poor in monetary or multidimensional terms, 2014 poverty map.
    definition_fr: "Part des pauvres au sens monétaire ou multidimensionnel, carte de la pauvreté 2014."
    definition_ar: "نسبة الفقراء نقديا أو متعدد الأبعاد، خريطة الفقر 2014."
  mpi:
    theme: poverty
    en: Multidimensional poverty index
    fr: Indice de pauvreté multidimensionnelle (MPI)
    ar: مؤشر الفقر متعدد الأبعاد (MPI)
    unit: index 0-1
    definition: MPI = H x A from HCP's May-2025 database, computed on the same basis for 2014 and 2024.
    definition_fr: "IPM = H x A issu de la base de données du HCP de mai 2025, calculé sur la même base pour 2014 et 2024."
    definition_ar: "MPI = H x A من قاعدة بيانات المندوبية السامية للتخطيط الصادرة في ماي 2025، محسوبا على الأساس نفسه لسنتي 2014 و2024."
  mpi_rate:
    theme: poverty
    en: Multidimensional poverty rate
    fr: Taux de pauvreté multidimensionnelle
    ar: معدل الفقر متعدد الأبعاد
    unit: "%"
    definition: Headcount H, share of the population in multidimensional poverty.
    definition_fr: "Incidence H, part de la population en situation de pauvreté multidimensionnelle."
    definition_ar: "نسبة الفقراء H، أي نسبة السكان الذين يعانون من الفقر متعدد الأبعاد."
  mpi_intensity:
    theme: poverty
    en: Intensity of multidimensional poverty
    fr: Intensité de la pauvreté multidimensionnelle
    ar: شدة الفقر متعدد الأبعاد
    unit: "%"
    definition: Average deprivation share A among the multidimensionally poor.
    definition_fr: "Part moyenne des privations A parmi les pauvres au sens multidimensionnel."
    definition_ar: "متوسط نسبة الحرمان A لدى الفقراء متعددي الأبعاد."
