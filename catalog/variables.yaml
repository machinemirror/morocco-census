  - id: communes_2024
    file: communes_2024.csv
    vintage: 2024
    key: code24
    en: RGPH 2024 commune indicators
    fr: Indicateurs communaux RGPH 2024
    ar: المؤشرات الجماعية لإحصاء 2024
    description: One row per commune (1,503, including the Western Sahara communes), sheets Population and
      Ménages of HCP's 2024 demographic and socio-economic indicators workbook. The six largest cities
      appear as single communes, not arrondissements.
    description_fr: "Une ligne par commune (1 503, y compris les communes du Sahara occidental), feuilles Population et Ménages du classeur des indicateurs démographiques et socio-économiques 2024 du HCP. Les six plus grandes villes y figurent comme communes uniques, et non en arrondissements."
    description_ar: "صف واحد لكل جماعة (1503، بما فيها جماعات الصحراء الغربية)، من ورقتي Population وMénages في مصنف المؤشرات الديمغرافية والسوسيو-اقتصادية لسنة 2024 للمندوبية السامية للتخطيط. تظهر المدن الست الكبرى كجماعات موحدة لا كمقاطعات."
    source: indicateurs2024
    columns:
      code24: {definition_fr: "Code géographique numérique du HCP ; jointure avec code24 de la table de correspondance.", definition_ar: "الرمز الجغرافي الرقمي للمندوبية السامية للتخطيط؛ يُربط بعمود code24 في جدول المقابلة.", en: Commune code (2024), fr: Code géographique (2024), ar: الرمز الجغرافي (2024), unit: code,
               definition: HCP numeric geographic code; joins to the crosswalk's code24.}
      name24: {definition_fr: "Libellé du HCP ('Commune de ...').", definition_ar: "تسمية المندوبية السامية للتخطيط («Commune de ...»).", en: Commune name (2024), fr: Nom de la commune (2024), ar: اسم الجماعة (2024), unit: text, definition: "HCP label ('Commune de ...')."}
