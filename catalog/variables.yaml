    fr: Taux de vulnérabilité à la pauvreté
    ar: معدل الهشاشة إزاء الفقر
    unit: "%"
    definition: Share of the population vulnerable to multidimensional poverty.

    definition_fr: "Part de la population vulnérable à la pauvreté multidimensionnelle."
    definition_ar: "نسبة السكان المعرضين للفقر متعدد الأبعاد."
