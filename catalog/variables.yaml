  - id: crosswalk_app2004
    file: crosswalk_app2004.csv
    key: app_code, code14
    en: 2004 app code crosswalk
    description: Links the Maroc en Chiffres app codes (communes_2004) to the 2014 spine, 1,537 of 1,538 communes. Several app units can share a 2014 commune (a rural commune and its autonomous centres, or communes merged after 2004), and an app unit split after 2004 appears once per part; values are combined population-weighted, counts shared by `weight`.
    columns:
      code14: {en: Commune code (2014), unit: code, definition: Spine key; repeats where several 2004 units form one 2014 commune.}
      app_code: {en: App commune code (2004), unit: code, definition: Key of communes_2004; repeats where a 2004 unit was split after 2004.}
      link: {en: Link type, unit: text, definition: "exact (name and province) | fuzzy (name similarity within a province) | province_split (2014 province created after 2004, matched within its 2004 provinces) | centre (autonomous centre joined to its rural commune) | review (catalog/link_review.csv: merges, renames and absorptions after 2004) | split (a 2004 unit divided between 2014 communes, catalog/link_review.csv)."}
      weight: {en: Share of the 2004 unit, unit: share, definition: "Share of the 2004 unit's counts that belongs to this 2014 commune: 1, or for a split its share of the parts' 2014 population. Rates are carried unchanged to every part."}
