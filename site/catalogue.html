<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>morocco-census · Catalogue</title>
<link rel="stylesheet" href="style.css">
<style>
  .filters { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 0.6rem; margin: 1rem 0; }
  @media (max-width: 760px) { .filters { grid-template-columns: 1fr 1fr; } .filters input { grid-column: 1 / -1; } }
  td .def { color: var(--text-2); font-size: 0.82rem; margin-top: 0.15rem; }
  td .src { font-size: 0.78rem; color: var(--text-3); margin-top: 0.2rem; }
  td code { white-space: nowrap; }
  .count { color: var(--text-3); font-size: 0.85rem; margin-bottom: 0.4rem; }
  .table-wrap { max-height: 72vh; overflow: auto; }
</style>
</head>
<body>
<header class="topbar"></header>
<div class="page">
  <div class="i18n" id="i18n-page"></div>
  <h1 data-t="title">Data catalogue</h1>
  <p class="lede" data-t="lede"></p>
  <div class="filters">
    <input id="q" type="search" placeholder="Search: electricity, IDH, analphabétisme…" aria-label="Search">
    <select id="ds" aria-label="Dataset"></select>
    <select id="th" aria-label="Theme"></select>
    <select id="yr" aria-label="Census"></select>
  </div>
  <div class="count" id="count"></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th data-t="h-var">Variable</th><th data-t="h-col">Column</th><th data-t="h-census">Census</th>
        <th data-t="h-unit">Unit</th><th data-t="h-cov">Coverage</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>
<footer class="site">Source: Haut-Commissariat au Plan (HCP), RGPH 2004, 2014, 2024 · derived data CC BY 4.0 ·
  <a href="https://github.com/machinemirror/morocco-census">GitHub</a></footer>
<script src="common.js"></script>
<script>
const L = {
  en: { title: "Data catalogue", lede: "Every column of every published table, with its definition, unit, census and exact HCP source field. Columns that measure the same concept across censuses share an indicator; notes flag where definitions differ. Indicators tagged 'map' are observed in all three censuses and are the ones the map shows; HCP's own French and Arabic labels are given for them.",
        "h-var": "Variable", "h-col": "Column", "h-census": "Census", "h-unit": "Unit", "h-cov": "Coverage",
        all: "All", allds: "All tables", allth: "All themes", allyr: "All censuses", of: "of", cols: "columns", id: "Identifier", comm: "communes" },
};
let C;
const t = k => L[MC.lang][k];
function options() {
  const keep = id => document.getElementById(id).value;
  const [ds, th, yr] = ["ds", "th", "yr"].map(keep);
  document.getElementById("ds").innerHTML = `<option value="">${t("allds")}</option>` +
    C.datasets.map(d => `<option value="${d.id}">${MC.esc(d.en)}</option>`).join("");
  document.getElementById("th").innerHTML = `<option value="">${t("allth")}</option>` +
    Object.entries(C.themes).map(([k, v]) => `<option value="${MC.esc(v.en)}">${MC.esc(v.en)}</option>`).join("") +
    `<option value="Identifier">${t("id")}</option>`;
  document.getElementById("yr").innerHTML = `<option value="">${t("allyr")}</option>` +
    [2004, 2014, 2024].map(y => `<option>${y}</option>`).join("");
  Object.entries({ ds, th, yr }).forEach(([k, v]) => (document.getElementById(k).value = v));
}
function render() {
  const q = document.getElementById("q").value.toLowerCase().trim();
  const ds = document.getElementById("ds").value, th = document.getElementById("th").value, yr = document.getElementById("yr").value;
  const names = Object.fromEntries(C.datasets.map(d => [d.id, d.en]));
  const rows = C.columns.filter(c =>
    (!ds || c.dataset === ds) && (!th || c.theme === th) && (!yr || String(c.vintage) === yr) &&
    (!q || [c.column, c.label_en, c.label_fr, c.label_ar, c.definition, c.source_field, c.note].join(" ").toLowerCase().includes(q)));
  document.getElementById("count").textContent = `${rows.length} ${t("of")} ${C.columns.length} ${t("cols")}`;
  document.getElementById("rows").innerHTML = rows.map(c => {
    const cov = C.coverage[c.dataset];
    const src = c.source ? `${c.source_url ? `<a href="${MC.esc(c.source_url)}">${MC.esc(c.source)}</a>` : MC.esc(c.source)}${c.source_field ? " — " + MC.esc(c.source_field) : ""}` : "";
    const hcp = [c.label_fr, c.label_ar].filter(Boolean).map(x => `<span dir="auto">${MC.esc(x)}</span>`).join(" · ");
    return `<tr>
      <td><b>${MC.esc(c.label_en)}</b>${c.comparable === false ? ' <span class="tag warn">≠</span>' : ""}${C.on_map.includes(c.indicator) ? ' <span class="tag">map</span>' : ""}
        ${hcp ? `<div class="src">HCP: ${hcp}</div>` : ""}
        <div class="def">${MC.esc(c.definition)}${c.note ? `<br><i>${MC.esc(c.note)}</i>` : ""}</div>
        ${src ? `<div class="src">${src}</div>` : ""}</td>
      <td><code>${MC.esc(c.column)}</code><div class="src">${MC.esc(names[c.dataset])}</div></td>
      <td>${c.vintage || ""}</td>
      <td>${MC.esc(MC.unitName(c.unit))}</td>
      <td class="num">${cov[c.column].toLocaleString()} / ${cov._rows.toLocaleString()}</td></tr>`;
  }).join("");
  document.querySelectorAll("[data-t]").forEach(el => (el.textContent = t(el.dataset.t)));
}
MC.header("catalogue");
fetch("data/catalog.json").then(r => r.json()).then(c => {
  C = c; options(); render();
  ["q", "ds", "th", "yr"].forEach(id => document.getElementById(id).addEventListener("input", render));
});
</script>
</body>
</html>
