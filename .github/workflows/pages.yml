name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run mc site
      - name: Stamp asset URLs with the commit so browsers refetch after each deploy
        run: |
          v=${GITHUB_SHA::7}
          sed -i -E "s/(href|src)=\"(style\.css|common\.js|map\.js)\"/\1=\"\2?v=$v\"/g" site/*.html
          sed -i -E "s#\"data/([a-z0-9_]+\.(json|geojson))\"#\"data/\1?v=$v\"#g" site/*.html site/*.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
